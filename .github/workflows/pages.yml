name: Demo su GitHub Pages

# Anteprima del sito (noindex) su https://malizia-g.github.io/mariolorenzetti.org/
# Editor e modulo contatti richiedono PHP: qui non funzionano.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PATH_PREFIX: /${{ github.event.repository.name }}/
          NOINDEX: "1"
          EDITOR_DEMO: "1"
          THEME_PICKER: "1"
          EVENTS_URL: ${{ secrets.EVENTS_URL }}
          ALLOW_STALE_DATA: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
